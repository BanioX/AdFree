    <radialGradient id="r" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffb2a4"/><stop offset=".45" stop-color="#ec4a3f"/><stop offset="1" stop-color="#a5221c"/></radialGradient>
    <radialGradient id="b" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#b4d6ff"/><stop offset=".45" stop-color="#3a7fe0"/><stop offset="1" stop-color="#1d4aa0"/></radialGradient>
