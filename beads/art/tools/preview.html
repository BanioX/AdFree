<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perlenbild – Kontaktbogen</title>
<style>
  :root { --bg: #fbf6ef; --text: #2b2420; --text-2: #7a6e64; --line: #e7ddd0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: var(--bg); color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 26px; font-weight: 850; }
  .sub { margin: 0 0 18px; color: var(--text-2); font-weight: 600; }
  .sheet { display: grid; grid-template-columns: repeat(var(--cols, 3), max-content); gap: 18px; align-items: start; }
  .card {
    background: #fff; border-radius: 22px; padding: 14px 14px 16px;
    box-shadow: 0 6px 20px rgba(70, 45, 20, .10), 0 1px 3px rgba(70, 45, 20, .08);
  }
  .head { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 2px; }
  .num { font-weight: 850; color: #3f8ef0; font-size: 15px; }
  .title { font-weight: 850; font-size: 19px; }
  .meta { color: var(--text-2); font-size: 13px; font-weight: 650; margin: 0 2px 8px; }
  .pal { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 2px 10px; }
  .pal span {
    display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px 2px 2px; border-radius: 999px;
    background: #f4ede3; font: 600 11px ui-monospace, Menlo, monospace; color: var(--text-2);
  }
  .pal i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; box-shadow: inset 0 -1px 2px rgba(0,0,0,.25); }
  .stage { border-radius: 16px; background: #f3eee6; padding: 10px; display: grid; place-items: center; }
  canvas { display: block; }
  .err { color: #e5484d; font-weight: 700; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Perlenbild – Kontaktbogen</h1>
<p class="sub" id="sub"></p>
<div class="sheet" id="sheet"></div>
<script type="module">
  // Parameter: ?from=0&to=6&box=420&cols=3&flat=1&only=heart,fox&ghost=1&src=scratch
  const q = new URLSearchParams(location.search);
  const sheet = document.getElementById('sheet');
  try {
    const mod = await import((q.get('src') ? `./out/${q.get('src')}.js` : '../index.js') + '?v=' + Date.now());
    const patterns = mod.patterns || mod.default;
    const only = q.get('only') ? q.get('only').split(',') : null;
    const from = +(q.get('from') || 0);
    const to = +(q.get('to') || patterns.length);
    const box = +(q.get('box') || 420);
    const flat = q.get('flat') === '1';
    const ghost = q.get('ghost') === '1';
    document.documentElement.style.setProperty('--cols', q.get('cols') || 3);
    const list = patterns.map((p, i) => ({ p, i })).filter(({ p, i }) => (only ? only.includes(p.id) : i >= from && i < to));
    document.getElementById('sub').textContent =
      `${patterns.length} Muster · gezeigt: ${list.length}` + (flat ? ' · flache Pixel' : ' · als Perlen');

    for (const { p, i } of list) {
      const w = p.rows[0].length, h = p.rows.length;
      const cell = Math.max(4, Math.min(34, Math.floor(box / Math.max(w, h))));
      const used = new Map();
      for (const r of p.rows) for (const c of r) if (c !== '.') used.set(c, (used.get(c) || 0) + 1);
      const beads = [...used.values()].reduce((a, b) => a + b, 0);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="head"><span class="num">${i + 1}</span><span class="title">${p.title}</span></div>
        <div class="meta">${p.category} · ${w}×${h} · ${Object.keys(p.palette).length} Farben · ${beads} Perlen · ${p.id}</div>
        <div class="pal">${Object.entries(p.palette).map(([k, v]) => `<span><i style="background:${v}"></i>${k} ${used.get(k) || 0}</span>`).join('')}</div>
        <div class="stage"></div>`;
      const cv = document.createElement('canvas');
      cv.width = w * cell; cv.height = h * cell;
      card.querySelector('.stage').append(cv);
      sheet.append(card);
      draw(cv.getContext('2d'), p, cell, flat, ghost);
    }
    document.body.dataset.ready = '1';
  } catch (err) {
    sheet.innerHTML = `<div class="err">${err.stack || err}</div>`;
    document.body.dataset.ready = 'error';
  }

  function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function mix(h, t, a) {
    const [r, g, b] = hex2rgb(h), [r2, g2, b2] = hex2rgb(t);
    return `rgb(${Math.round(r + (r2 - r) * a)},${Math.round(g + (g2 - g) * a)},${Math.round(b + (b2 - b) * a)})`;
  }

  function draw(ctx, p, s, flat, ghost) {
    p.rows.forEach((row, y) => {
      [...row].forEach((c, x) => {
        const px = x * s, py = y * s;
        if (c === '.') {
          if (ghost) { ctx.fillStyle = 'rgba(120,100,80,.12)'; ctx.beginPath(); ctx.arc(px + s / 2, py + s / 2, s * 0.12, 0, Math.PI * 2); ctx.fill(); }
          return;
        }
        const col = p.palette[c] || '#ff00ff';
        if (flat) { ctx.fillStyle = col; ctx.fillRect(px, py, s, s); return; }
        gem(ctx, px + s / 2, py + s / 2, s, col);
      });
    });
  }

  // Glänzende, runde Perle (wie im Spiel geplant): Schatten, Radialverlauf, Glanzpunkt.
  function gem(ctx, cx, cy, s, col) {
    const r = s * 0.47;
    ctx.fillStyle = 'rgba(70,45,20,.20)';
    ctx.beginPath(); ctx.arc(cx, cy + s * 0.05, r, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.08, cx, cy, r);
    g.addColorStop(0, mix(col, '#ffffff', 0.45));
    g.addColorStop(0.5, col);
    g.addColorStop(1, mix(col, '#000000', 0.22));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.ellipse(cx - r * 0.33, cy - r * 0.4, r * 0.26, r * 0.15, -0.6, 0, Math.PI * 2); ctx.fill();
  }
</script>
</body>
</html>
