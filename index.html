<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Spielpause</title>
  <meta name="description" content="Entspannte Spiele – ganz ohne Werbung.">
  <meta name="theme-color" content="#fbf6ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spielpause">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="shared/style.css">
  <style>
    .hub { padding: 4px 16px calc(28px + var(--safe-bottom)); max-width: 640px; margin: 0 auto; }
    .hub-head { padding: 16px 4px 8px; display: flex; align-items: center; gap: 12px; }
    .hub-head h1 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -.02em; }
    .hub-head p { margin: 2px 0 0; color: var(--text-2); font-weight: 650; font-size: 15px; }
    .hub-head .grow { flex: 1 1 auto; min-width: 0; }

    .section-title {
      margin: 22px 4px 10px; font-size: 13px; font-weight: 800; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text-3);
      display: flex; align-items: center; gap: 8px;
    }

    /* Tagesrätsel-Leiste */
    .daily {
      display: flex; gap: 10px; overflow-x: auto; padding: 2px 4px 8px; margin: 0 -16px; padding-left: 20px; padding-right: 20px;
      scrollbar-width: none; scroll-snap-type: x proximity;
    }
    .daily::-webkit-scrollbar { display: none; }
    .daily a {
      flex: 0 0 auto; scroll-snap-align: start;
      display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px;
      border-radius: 18px; background: var(--surface); box-shadow: var(--shadow);
      text-decoration: none; color: inherit; transition: transform .15s var(--ease-out);
    }
    .daily a:active { transform: scale(.96); }
    .daily img, .daily .ph { width: 40px; height: 40px; border-radius: 11px; flex: 0 0 auto; }
    .daily .ph { font-size: 20px; }
    .daily b { display: block; font-size: 15px; font-weight: 800; }
    .daily small { display: block; font-size: 12.5px; font-weight: 700; color: var(--text-2); }
    .daily .done small { color: var(--good); }

    /* Kategorien */
    .chips { display: flex; gap: 8px; overflow-x: auto; margin: 10px -16px 4px; padding: 2px 20px 6px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }

    /* Katalog: 4 Kacheln pro Reihe */
    .grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 12px; row-gap: 18px; padding: 8px 2px 0;
    }
    .tile {
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      text-decoration: none; color: inherit; min-width: 0; position: relative;
      -webkit-touch-callout: none;
    }
    .tile .ic {
      width: 100%; aspect-ratio: 1; border-radius: 23%; overflow: hidden; position: relative;
      box-shadow: 0 6px 14px rgba(70, 45, 20, .14), 0 1px 3px rgba(70, 45, 20, .10);
      transition: transform .18s var(--ease-out);
      background: var(--surface-2);
    }
    .tile:active .ic { transform: scale(.9); }
    .tile .ic img { width: 100%; height: 100%; display: block; }
    .tile .ic .ph { width: 100%; height: 100%; }
    .tile .ic::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .05);
    }
    .tile .name {
      font-size: 12.5px; font-weight: 750; text-align: center; line-height: 1.2;
      width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      letter-spacing: -.015em; -webkit-hyphens: manual; hyphens: manual; overflow-wrap: anywhere;
    }
    .tile .new {
      position: absolute; top: -6px; right: -6px; z-index: 2;
      padding: 2px 6px; border-radius: 999px; background: var(--bad); color: #fff;
      font-size: 10.5px; font-weight: 850; box-shadow: 0 0 0 2px var(--bg);
    }
    .tile .dot {
      position: absolute; top: -3px; right: -3px; z-index: 2; width: 14px; height: 14px; border-radius: 50%;
      background: var(--good); box-shadow: 0 0 0 2px var(--bg);
      display: grid; place-items: center;
    }
    .ph { display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 28px; }
    
    /* Info-Blatt beim langen Drücken */
    .info-ic { width: 84px; height: 84px; border-radius: 22px; overflow: hidden; margin: 0 auto 12px; box-shadow: var(--shadow); }
    .info-ic img, .info-ic .ph { width: 100%; height: 100%; }
    .info-ic .ph { font-size: 40px; }
    .info-status { margin-top: 6px; font-weight: 700; color: var(--text); }

    .search {
      display: flex; align-items: center; gap: 8px; margin: 10px 0 0; padding: 0 14px; height: 46px;
      background: var(--surface); border-radius: 16px; box-shadow: 0 1px 3px rgba(70, 45, 20, .10);
      color: var(--text-3);
    }
    .search input {
      flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px;
      font-weight: 650; color: var(--text); -webkit-user-select: text; user-select: text;
    }
    .search input::placeholder { color: var(--text-3); }
    .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
    .search .clear { border: 0; background: var(--surface-2); color: var(--text-2); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
    .cat-title { display: flex; align-items: baseline; gap: 8px; }
    .cat-title small { font-weight: 700; color: var(--text-3); letter-spacing: 0; text-transform: none; font-size: 13px; }
    .empty { text-align: center; color: var(--text-2); font-weight: 650; padding: 30px 10px; }
    .tile .fav { position: absolute; top: -5px; left: -5px; z-index: 2; width: 22px; height: 22px; border-radius: 50%;
      background: #ffd23f; color: #7a5a00; display: grid; place-items: center; font-size: 13px; box-shadow: 0 0 0 2px var(--bg); }
    .tile.soon .ic { filter: grayscale(.55) opacity(.6); }
    .tile.soon .name { color: var(--text-3); }
    .tile .soon-badge { position: absolute; top: -6px; right: -6px; z-index: 2; padding: 2px 7px; border-radius: 999px;
      background: var(--surface-3); color: var(--text-2); font-size: 10.5px; font-weight: 850; box-shadow: 0 0 0 2px var(--bg); }
    .daily a.soon { opacity: .55; }
    .lang-btn { font-weight: 900; font-size: 14px; letter-spacing: .02em; }
    .foot { margin: 30px 0 0; text-align: center; color: var(--text-3); font-size: 14px; font-weight: 600; }
    .foot .heart { color: #ff6f7d; }

    /* Erbauer: Vergleichsleiste und Abschnitte */
    .score {
      display: flex; gap: 8px; margin: 12px -2px 2px; padding: 1px 2px 4px;
      overflow-x: auto; scrollbar-width: none;
    }
    .score::-webkit-scrollbar { display: none; }
    .score-btn {
      position: relative; flex: 1 0 150px; min-width: 0;
      display: flex; align-items: center; gap: 8px;
      height: 54px; padding: 0 12px 0 8px; border: 0; border-radius: 18px;
      background: var(--b-soft, var(--surface)); color: var(--b, var(--text));
      text-align: left;
      box-shadow: 0 1px 3px rgba(70, 45, 20, .08);
    }
    .score-btn::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      box-shadow: inset 0 0 0 1.5px var(--b); opacity: .32;
    }
    .score-btn:active { transform: scale(.98); }
    .score-btn img {
      width: 36px; height: 36px; flex: 0 0 auto; border-radius: 50%;
      background: var(--b); padding: 8px; box-sizing: border-box;
    }
    .score-btn .nm { display: flex; flex-direction: column; min-width: 0; line-height: 1.12; }
    .score-btn .nm b {
      font-size: 15px; font-weight: 850; letter-spacing: -.02em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .score-btn .nm small { font-size: 12px; font-weight: 750; opacity: .75; }

    .builder {
      margin: 18px -4px 4px; padding: 14px 4px 2px; border-radius: 26px;
      background: linear-gradient(180deg, var(--b-soft, transparent) 0%, rgba(251, 246, 239, 0) 156px);
      scroll-margin-top: 10px;
    }
    h2.builder-head {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin: 0 2px 6px; padding: 0;
      font-size: inherit; font-weight: inherit; letter-spacing: 0;
      text-transform: none; color: inherit;
    }
    .built {
      display: inline-flex; align-items: stretch; height: 28px;
      border-radius: 999px; overflow: hidden;
      background: var(--b, var(--text)); color: #fff;
      font-size: 12.5px; font-weight: 800; letter-spacing: -.011em; line-height: 1;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 4px 12px rgba(40, 30, 20, .14);
    }
    .built-mark { display: grid; place-items: center; width: 30px; background: rgba(0, 0, 0, .18); }
    .built-mark img { width: 16px; height: 16px; }
    .built-text { display: grid; place-items: center; padding: 0 12px 0 9px; white-space: nowrap; }
    .built-line {
      flex: 1 1 18px; height: 2px; min-width: 16px; border-radius: 2px;
      background: linear-gradient(90deg, var(--b), transparent); opacity: .5;
    }
    .built-count {
      font-size: 12.5px; font-weight: 800; color: var(--b); background: #fff;
      border-radius: 999px; padding: 5px 10px; white-space: nowrap;
      box-shadow: 0 1px 3px rgba(70, 45, 20, .10);
    }
    .builder .section-title { margin-top: 14px; }
    .builder .section-title::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%;
      background: var(--b); flex: 0 0 auto;
    }
    .tile .by {
      position: absolute; z-index: 2; right: 5px; bottom: 5px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--b); display: grid; place-items: center; pointer-events: none;
      box-shadow: 0 0 0 1.5px #fff, 0 1px 3px rgba(40, 30, 20, .28);
    }
    .tile .by img { width: 11px; height: 11px; }
    .info-built { display: flex; justify-content: center; margin: 4px 0 2px; }

    .install-tip {
      margin: 16px 0 0; padding: 14px 16px; border-radius: 18px;
      background: var(--surface-2); color: var(--text-2); font-size: 14px; font-weight: 600;
    }
    .install-tip b { color: var(--text); }
    .install-tip svg { display: inline; vertical-align: -4px; width: 18px; height: 18px; }

    @media (min-width: 520px) {
      .grid { column-gap: 18px; row-gap: 22px; }
      .tile .name { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="scroll" id="scroll">
      <main class="hub">
        <header class="hub-head">
          <div class="grow">
            <h1>Spielpause</h1>
            <p id="tagline">Entspannt spielen – ohne Werbung.</p>
          </div>
          <span id="sound"></span>
        </header>

        <div class="install-tip hidden" id="install-tip">
          <b>Tipp:</b> Im Safari auf
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8"/><path d="M5 12v7.5h14V12"/></svg>
          tippen und <b>«Zum Home-Bildschirm»</b> wählen – dann startet Spielpause wie eine echte App, auch offline.
        </div>

        <label class="search" for="q">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="q" type="search" placeholder="Spiel suchen" autocomplete="off" enterkeyhint="search">
          <button class="clear hidden" id="q-clear" type="button" aria-label="Suche löschen">✕</button>
        </label>
        <div class="score" id="score"></div>
        <div class="chips" id="chips" role="tablist"></div>
        <div id="catalog"></div>

        <section id="daily-wrap" class="hidden">
          <h2 class="section-title" id="daily-title">Tagesrätsel</h2>
          <div class="daily" id="daily"></div>
        </section>

        <p class="foot" id="foot">Gemacht mit <span class="heart">♥</span> – keine Werbung, keine Käufe.</p>
      </main>
    </div>
  </div>

  <script type="module">
    import { games, categories, builders, gameText } from './games.js';
    import { L, lang, setLang, plural, fmt } from './shared/i18n.js';
    import { setupPage, soundButton, showModal, h, toast } from './shared/ui.js';
    import { store, readSummary, isDailyDone, dailyStreak } from './shared/storage.js';
    import { sfx } from './shared/sfx.js';

    setupPage();
    document.getElementById('sound').append(soundButton());
    document.getElementById('tagline').textContent = L(`${games.length} Spiele – ganz ohne Werbung.`, `${games.length} games – no ads at all.`);
    document.getElementById('q').placeholder = L('Spiel suchen', 'Search games');
    document.getElementById('q-clear').setAttribute('aria-label', L('Suche löschen', 'Clear search'));
    document.getElementById('daily-title').textContent = L('Tagesrätsel', 'Daily puzzles');
    document.getElementById('foot').innerHTML = L('Gemacht mit <span class="heart">♥</span> – keine Werbung, keine Käufe.', 'Made with <span class="heart">♥</span> – no ads, no purchases.');
    document.getElementById('install-tip').innerHTML = L(document.getElementById('install-tip').innerHTML,
      '<b>Tip:</b> In Safari, tap the share icon and choose <b>“Add to Home Screen”</b> – Spielpause then starts like a real app, even offline.');

    // Sprachschalter DE/EN
    const langBtn = h('button.icon-btn.lang-btn', { type: 'button', 'aria-label': L('Sprache: Deutsch – tippen für Englisch', 'Language: English – tap for German') }, lang === 'en' ? 'EN' : 'DE');
    langBtn.addEventListener('click', () => setLang(lang === 'en' ? 'de' : 'en'));
    document.getElementById('sound').before(langBtn);

    // «Neu» nur für Spiele, die nach dem ersten Besuch dazugekommen sind (14 Tage lang, bis gespielt)
    const NEW_DAYS = 14;
    const firstVisit = store.get('hub.firstVisit', null) || (store.set('hub.firstVisit', new Date().toISOString().slice(0, 10)), store.get('hub.firstVisit'));
    const isNew = (g) => g.added && g.added > firstVisit
      && (Date.now() - new Date(g.added + 'T00:00:00').getTime()) < NEW_DAYS * 864e5
      && !store.get('played.' + g.id, false);

    // Fertige Spiele (ready.json kommt aus dem Build). Lokal ohne Build gelten alle als fertig.
    let READY = null;
    const isReady = (g) => !READY || READY.has(g.id);
    function soonToast(e) {
      e.preventDefault();
      e.stopImmediatePropagation();
      toast(L('Kommt bald – wird gerade gebaut', 'Coming soon – being built right now'));
    }

    const T = (g) => gameText(g, lang);
    const catTitle = (c) => (lang === 'en' && c.title_en) || c.title;
    document.getElementById('score').setAttribute('aria-label', L('Nach Erbauer', 'By builder'));

    function builderOf(g) {
      return builders.find((b) => b.id === g.builder) || {
        id: g.builder || 'offen',
        name: g.builder || L('Offen', 'Open'),
        color: '#8d8278',
        soft: '#f3ece4',
        glyph: '',
      };
    }
    const builtLabel = (b) => fmt(L('Gebaut mit {name}', 'Built with {name}'), { name: b.name });
    // Eigene Farben als CSS-Variablen. setProperty, weil die Kurzform im Helfer sie verwirft.
    function paint(el, b) {
      if (!el || !b) return el;
      el.style.setProperty('--b', b.color);
      if (b.soft) el.style.setProperty('--b-soft', b.soft);
      return el;
    }
    function builtBadge(b) {
      return paint(h('span.built', null,
        b.glyph ? h('span.built-mark', null, h('img', { src: b.glyph, alt: '' })) : null,
        h('span.built-text', null, builtLabel(b))), b);
    }
    function groupByBuilder(list) {
      const order = builders.map((b) => b.id);
      const map = new Map();
      for (const g of list) {
        const b = builderOf(g);
        if (!map.has(b.id)) {
          map.set(b.id, { builder: b, games: [] });
          if (!order.includes(b.id)) order.push(b.id);
        }
        map.get(b.id).games.push(g);
      }
      return order.filter((id) => map.has(id)).map((id) => map.get(id));
    }

    function iconEl(g, cls = '') {
      const img = h('img', { src: `icons/games/${g.id}.svg`, alt: '', draggable: 'false', class: cls, loading: 'lazy' });
      img.addEventListener('error', () => {
        const ph = h('div.ph', { style: { background: `linear-gradient(145deg, ${g.color}cc, ${g.color})` } }, T(g).title[0]);
        img.replaceWith(ph);
      }, { once: true });
      return img;
    }

    function rememberPlay(g) {
      store.set('played.' + g.id, true);
      store.update('recent', [], (list) => [g.id, ...list.filter((x) => x !== g.id)].slice(0, 8));
    }

    function tile(g, { badges = true } = {}) {
      const b = builderOf(g);
      const ic = h('div.ic', null, iconEl(g));
      if (b.glyph) {
        ic.append(paint(h('span.by', { title: builtLabel(b), 'aria-hidden': 'true' },
          h('img', { src: b.glyph, alt: '' })), b));
      }
      const a = h('a.tile', { href: `${g.id}/`, 'aria-label': `${T(g).title} – ${T(g).subtitle}. ${builtLabel(b)}` },
        ic,
        h('span.name', null, T(g).tile));
      if (!isReady(g)) {
        a.classList.add('soon');
        a.append(h('span.soon-badge', null, L('Bald', 'Soon')));
        a.addEventListener('click', soonToast, { capture: true });
        return a;
      }
      if (badges && isNew(g)) a.append(h('span.new', null, L('Neu', 'New')));
      if (badges && store.get('favorites', []).includes(g.id)) a.append(h('span.fav', null, '★'));
      a.addEventListener('click', () => { sfx.play('tap'); rememberPlay(g); });
      // Langes Drücken: Info zum Spiel
      let timer = 0, sx = 0, sy = 0, long = false;
      a.addEventListener('pointerdown', (e) => {
        long = false; sx = e.clientX; sy = e.clientY;
        timer = setTimeout(() => { long = true; showInfo(g); }, 550);
      });
      const cancel = () => clearTimeout(timer);
      a.addEventListener('pointermove', (e) => { if (Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel(); });
      a.addEventListener('pointerup', cancel);
      a.addEventListener('pointercancel', cancel);
      a.addEventListener('click', (e) => { if (long) { e.preventDefault(); e.stopImmediatePropagation(); } }, { capture: true });
      return a;
    }

    function showInfo(g) {
      const s = readSummary(g.id);
      const content = h('div', null,
        h('div.info-ic', null, iconEl(g)),
        h('p', null, T(g).subtitle),
        h('div.info-built', null, builtBadge(builderOf(g))),
        s && s.text ? h('p.info-status', null, s.text) : null);
      showModal({
        title: T(g).title, content,
        buttons: [
          { label: L('Spielen', 'Play'), value: 'play', primary: true },
          ...(g.daily ? [{ label: L('Tagesrätsel', 'Daily puzzle'), value: 'daily' }] : []),
          { label: isFav(g) ? L('★ Aus Favoriten entfernen', '★ Remove from favorites') : L('☆ Zu Favoriten', '☆ Add to favorites'), value: 'fav' },
          { label: L('Schliessen', 'Close'), value: null, ghost: true },
        ],
      }).then((v) => {
        if (!v) return;
        if (v === 'fav') { toggleFav(g); render(); return; }
        rememberPlay(g);
        location.href = `${g.id}/${v === 'daily' ? '#daily' : ''}`;
      });
    }

    // Tagesrätsel (nur fertige Spiele)
    function renderDaily() {
      const dailies = games.filter((g) => g.daily && isReady(g));
      const wrap = document.getElementById('daily-wrap');
      const box = document.getElementById('daily');
      wrap.classList.toggle('hidden', !dailies.length);
      box.replaceChildren();
      const sorted = [...dailies].sort((a, b) => isDailyDone(a.id) - isDailyDone(b.id));
      for (const g of sorted) {
        const done = isDailyDone(g.id);
        const streak = dailyStreak(g.id);
        const a = h('a', { href: `${g.id}/#daily`, class: done ? 'done' : '' },
          iconEl(g),
          h('span', null,
            h('b', null, T(g).title),
            h('small', null, done ? L(`✓ Gelöst${streak > 1 ? ` · ${streak} Tage` : ''}`, `✓ Solved${streak > 1 ? ` · ${streak} days` : ''}`) : (streak > 0 ? L(`Serie: ${streak} Tage`, `Streak: ${streak} days`) : L('Heute neu', 'New today')))));
        a.addEventListener('click', () => { sfx.play('tap'); rememberPlay(g); });
        box.append(a);
      }
    }
    renderDaily();

    // ---------- Favoriten ----------
    const favs = () => store.get('favorites', []);
    const isFav = (g) => favs().includes(g.id);
    function toggleFav(g) {
      store.update('favorites', [], (l) => (l.includes(g.id) ? l.filter((x) => x !== g.id) : [...l, g.id]));
    }

    // ---------- Kategorien + Katalog ----------
    const chips = document.getElementById('chips');
    const catalog = document.getElementById('catalog');
    const q = document.getElementById('q');
    const qClear = document.getElementById('q-clear');
    let current = store.get('hub.category', 'alle');

    const norm = (t) => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f\u00ad]/g, '');
    const gridOf = (list) => h('div.grid', null, list.map((g) => tile(g)));
    const section = (title, list) => h('section', null,
      h('h2.section-title.cat-title', null, title, h('small', null, String(list.length))), gridOf(list));

    function builderSection(b, list, { subcats }) {
      const head = paint(h('h2.builder-head', null,
        builtBadge(b),
        h('span.built-line', { 'aria-hidden': 'true' }),
        h('span.built-count', null, plural(list.length, ['Spiel', 'Spiele'], ['game', 'games']))), b);
      const parts = [head];
      if (subcats) {
        const known = new Set(categories.map((c) => c.id));
        for (const c of categories) {
          const sub = list.filter((g) => g.category === c.id);
          if (!sub.length) continue;
          parts.push(h('h3.section-title.cat-title', null, catTitle(c), h('small', null, String(sub.length))));
          parts.push(gridOf(sub));
        }
        const rest = list.filter((g) => !known.has(g.category));
        if (rest.length) parts.push(gridOf(rest));
      } else if (list.length) {
        parts.push(gridOf(list));
      }
      return paint(h('section.builder', { id: 'builder-' + b.id }, ...parts), b);
    }

    function renderScore(groups) {
      const score = document.getElementById('score');
      score.classList.toggle('hidden', !groups.length);
      score.replaceChildren(...groups.map(({ builder: b, games: list }) => {
        const btn = paint(h('button.score-btn', {
          type: 'button',
          'aria-label': `${builtLabel(b)}, ${plural(list.length, ['Spiel', 'Spiele'], ['game', 'games'])}`,
        },
          b.glyph ? h('img', { src: b.glyph, alt: '' }) : null,
          h('span.nm', null,
            h('b', null, b.name),
            h('small', null, plural(list.length, ['Spiel', 'Spiele'], ['game', 'games'])))), b);
        btn.addEventListener('click', () => {
          document.getElementById('builder-' + b.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        return btn;
      }));
    }

    function renderChips() {
      const recentIds = store.get('recent', []);
      const opts = [{ id: 'alle', title: L('Alle', 'All') }];
      if (favs().length) opts.push({ id: 'favoriten', title: L('★ Favoriten', '★ Favorites') });
      if (recentIds.length) opts.push({ id: 'zuletzt', title: L('Zuletzt', 'Recent') });
      opts.push(...categories.filter((c) => games.some((g) => g.category === c.id)));
      if (!opts.some((o) => o.id === current)) current = 'alle';
      chips.replaceChildren(...opts.map((c) => {
        const b = h('button.chip', { type: 'button', role: 'tab', 'data-id': c.id, class: 'chip' + (c.id === current ? ' active' : '') }, catTitle(c));
        b.addEventListener('click', () => { current = c.id; store.set('hub.category', current); render(); });
        return b;
      }));
    }

    function visibleGames(term) {
      if (term) {
        return games.filter((g) => {
          const b = builderOf(g);
          const cat = categories.find((c) => c.id === g.category) || {};
          return norm(`${g.title} ${g.subtitle} ${g.title_en || ''} ${g.subtitle_en || ''} ${g.tile || ''} ${g.tile_en || ''} ${cat.title || ''} ${cat.title_en || ''} ${b.name} ${b.id} Gebaut mit ${b.name} Built with ${b.name}`).includes(term);
        });
      }
      if (current === 'favoriten') return favs().map((id) => games.find((g) => g.id === id)).filter(Boolean);
      if (current === 'zuletzt') return store.get('recent', []).map((id) => games.find((g) => g.id === id)).filter(Boolean);
      if (current === 'alle') return games;
      return games.filter((g) => g.category === current);
    }

    function render() {
      renderChips();
      const term = norm(q.value.trim());
      qClear.classList.toggle('hidden', !term);
      const list = visibleGames(term);
      const groups = groupByBuilder(list);
      const subcats = !term && current === 'alle';
      const out = [];
      if (!term && current === 'alle') {
        const recent = store.get('recent', []).map((id) => games.find((g) => g.id === id)).filter(Boolean).slice(0, 4);
        if (recent.length && games.length > 8) out.push(section(L('Zuletzt gespielt', 'Recently played'), recent));
      }
      if (!list.length) {
        out.push(h('p.empty', null, term
          ? L('Kein Spiel gefunden.', 'No game found.')
          : L('Noch nichts hier.', 'Nothing here yet.')));
      } else {
        for (const group of groups) out.push(builderSection(group.builder, group.games, { subcats }));
      }
      renderScore(term || current !== 'alle' ? groups : groupByBuilder(games));
      catalog.replaceChildren(...out);
    }
    q.addEventListener('input', render);
    qClear.addEventListener('click', () => { q.value = ''; render(); q.blur(); });
    render();

    fetch('ready.json', { cache: 'no-cache' })
      .then((r) => (r.ok ? r.json() : null))
      .then((list) => {
        if (!Array.isArray(list)) return;
        READY = new Set(list);
        render();
        renderDaily();
      })
      .catch(() => {});

    // Scrollposition merken (zurück aus einem Spiel)
    const scroller = document.getElementById('scroll');
    scroller.scrollTop = store.get('hub.scroll', 0);
    scroller.addEventListener('scroll', () => store.set('hub.scroll', scroller.scrollTop), { passive: true });

    // Installations-Tipp nur in Safari ausserhalb des Home-Bildschirm-Modus
    const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios && !standalone && !store.get('hub.tipHidden', false)) {
      const tip = document.getElementById('install-tip');
      tip.classList.remove('hidden');
      tip.addEventListener('click', () => { tip.classList.add('hidden'); store.set('hub.tipHidden', true); });
    }

    // Kehrt man per Zurück-Geste zurück (bfcache), Status neu laden
    window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
  </script>
</body>
</html>
