<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Spielpause</title>
  <meta name="description" content="Entspannte Spiele – ganz ohne Werbung.">
  <meta name="theme-color" content="#fbf6ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spielpause">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="shared/style.css">
  <style>
    .hub { padding: 4px 16px calc(28px + var(--safe-bottom)); max-width: 640px; margin: 0 auto; }
    .hub-head { padding: 16px 4px 8px; display: flex; align-items: center; gap: 12px; }
    .hub-head h1 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -.02em; }
    .hub-head p { margin: 2px 0 0; color: var(--text-2); font-weight: 650; font-size: 15px; }
    .hub-head .grow { flex: 1 1 auto; min-width: 0; }

    .section-title {
      margin: 22px 4px 10px; font-size: 13px; font-weight: 800; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text-3);
      display: flex; align-items: center; gap: 8px;
    }

    /* Tagesrätsel-Leiste */
    .daily {
      display: flex; gap: 10px; overflow-x: auto; padding: 2px 4px 8px; margin: 0 -16px; padding-left: 20px; padding-right: 20px;
      scrollbar-width: none; scroll-snap-type: x proximity;
    }
    .daily::-webkit-scrollbar { display: none; }
    .daily a {
      flex: 0 0 auto; scroll-snap-align: start;
      display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px;
      border-radius: 18px; background: var(--surface); box-shadow: var(--shadow);
      text-decoration: none; color: inherit; transition: transform .15s var(--ease-out);
    }
    .daily a:active { transform: scale(.96); }
    .daily img, .daily .ph { width: 40px; height: 40px; border-radius: 11px; flex: 0 0 auto; }
    .daily .ph { font-size: 20px; }
    .daily b { display: block; font-size: 15px; font-weight: 800; }
    .daily small { display: block; font-size: 12.5px; font-weight: 700; color: var(--text-2); }
    .daily .done small { color: var(--good); }

    /* Kategorien */
    .chips { display: flex; gap: 8px; overflow-x: auto; margin: 10px -16px 4px; padding: 2px 20px 6px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }

    /* Katalog: 4 Kacheln pro Reihe */
    .grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 12px; row-gap: 18px; padding: 8px 2px 0;
    }
    .tile {
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      text-decoration: none; color: inherit; min-width: 0; position: relative;
      -webkit-touch-callout: none;
    }
    .tile .ic {
      width: 100%; aspect-ratio: 1; border-radius: 23%; overflow: hidden; position: relative;
      box-shadow: 0 6px 14px rgba(70, 45, 20, .14), 0 1px 3px rgba(70, 45, 20, .10);
      transition: transform .18s var(--ease-out);
      background: var(--surface-2);
    }
    .tile:active .ic { transform: scale(.9); }
    .tile .ic img { width: 100%; height: 100%; display: block; }
    .tile .ic .ph { width: 100%; height: 100%; }
    .tile .ic::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .05);
    }
    .tile .name {
      font-size: 12.5px; font-weight: 750; text-align: center; line-height: 1.2;
      width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      letter-spacing: -.015em; -webkit-hyphens: manual; hyphens: manual; overflow-wrap: anywhere;
    }
    .tile .new {
      position: absolute; top: -6px; right: -6px; z-index: 2;
      padding: 2px 6px; border-radius: 999px; background: var(--bad); color: #fff;
      font-size: 10.5px; font-weight: 850; box-shadow: 0 0 0 2px var(--bg);
    }
    .tile .dot {
      position: absolute; top: -3px; right: -3px; z-index: 2; width: 14px; height: 14px; border-radius: 50%;
      background: var(--good); box-shadow: 0 0 0 2px var(--bg);
      display: grid; place-items: center;
    }
    .ph { display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 28px; }
    
    /* Info-Blatt beim langen Drücken */
    .info-ic { width: 84px; height: 84px; border-radius: 22px; overflow: hidden; margin: 0 auto 12px; box-shadow: var(--shadow); }
    .info-ic img, .info-ic .ph { width: 100%; height: 100%; }
    .info-ic .ph { font-size: 40px; }
    .info-status { margin-top: 6px; font-weight: 700; color: var(--text); }

    .foot { margin: 30px 0 0; text-align: center; color: var(--text-3); font-size: 14px; font-weight: 600; }
    .foot .heart { color: #ff6f7d; }

    .install-tip {
      margin: 16px 0 0; padding: 14px 16px; border-radius: 18px;
      background: var(--surface-2); color: var(--text-2); font-size: 14px; font-weight: 600;
    }
    .install-tip b { color: var(--text); }
    .install-tip svg { display: inline; vertical-align: -4px; width: 18px; height: 18px; }

    @media (min-width: 520px) {
      .grid { column-gap: 18px; row-gap: 22px; }
      .tile .name { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="scroll" id="scroll">
      <main class="hub">
        <header class="hub-head">
          <div class="grow">
            <h1>Spielpause</h1>
            <p id="tagline">Entspannt spielen – ohne Werbung.</p>
          </div>
          <span id="sound"></span>
        </header>

        <div class="install-tip hidden" id="install-tip">
          <b>Tipp:</b> Im Safari auf
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8"/><path d="M5 12v7.5h14V12"/></svg>
          tippen und <b>«Zum Home-Bildschirm»</b> wählen – dann startet Spielpause wie eine echte App, auch offline.
        </div>

        <div class="chips" id="chips" role="tablist"></div>
        <div class="grid" id="grid"></div>

        <section id="daily-wrap" class="hidden">
          <h2 class="section-title">Tagesrätsel</h2>
          <div class="daily" id="daily"></div>
        </section>

        <p class="foot">Gemacht mit <span class="heart">♥</span> – keine Werbung, keine Käufe.</p>
      </main>
    </div>
  </div>

  <script type="module">
    import { games, categories } from './games.js';
    import { setupPage, soundButton, showModal, h } from './shared/ui.js';
    import { store, readSummary, isDailyDone, dailyStreak } from './shared/storage.js';
    import { sfx } from './shared/sfx.js';

    setupPage();
    document.getElementById('sound').append(soundButton());
    document.getElementById('tagline').textContent = `${games.length} Spiele – ganz ohne Werbung.`;

    // «Neu» nur für Spiele, die nach dem ersten Besuch dazugekommen sind (14 Tage lang, bis gespielt)
    const NEW_DAYS = 14;
    const firstVisit = store.get('hub.firstVisit', null) || (store.set('hub.firstVisit', new Date().toISOString().slice(0, 10)), store.get('hub.firstVisit'));
    const isNew = (g) => g.added && g.added > firstVisit
      && (Date.now() - new Date(g.added + 'T00:00:00').getTime()) < NEW_DAYS * 864e5
      && !store.get('played.' + g.id, false);

    function iconEl(g, cls = '') {
      const img = h('img', { src: `icons/games/${g.id}.svg`, alt: '', draggable: 'false', class: cls, loading: 'lazy' });
      img.addEventListener('error', () => {
        const ph = h('div.ph', { style: { background: `linear-gradient(145deg, ${g.color}cc, ${g.color})` } }, g.title[0]);
        img.replaceWith(ph);
      }, { once: true });
      return img;
    }

    function rememberPlay(g) {
      store.set('played.' + g.id, true);
      store.update('recent', [], (list) => [g.id, ...list.filter((x) => x !== g.id)].slice(0, 8));
    }

    function tile(g, { badges = true } = {}) {
      const a = h('a.tile', { href: `${g.id}/`, 'aria-label': `${g.title} – ${g.subtitle}` },
        h('div.ic', null, iconEl(g)),
        h('span.name', null, g.tile || g.title));
      if (badges && isNew(g)) a.append(h('span.new', null, 'Neu'));
      a.addEventListener('click', () => { sfx.play('tap'); rememberPlay(g); });
      // Langes Drücken: Info zum Spiel
      let timer = 0, sx = 0, sy = 0, long = false;
      a.addEventListener('pointerdown', (e) => {
        long = false; sx = e.clientX; sy = e.clientY;
        timer = setTimeout(() => { long = true; showInfo(g); }, 550);
      });
      const cancel = () => clearTimeout(timer);
      a.addEventListener('pointermove', (e) => { if (Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel(); });
      a.addEventListener('pointerup', cancel);
      a.addEventListener('pointercancel', cancel);
      a.addEventListener('click', (e) => { if (long) { e.preventDefault(); e.stopImmediatePropagation(); } }, { capture: true });
      return a;
    }

    function showInfo(g) {
      const s = readSummary(g.id);
      const content = h('div', null,
        h('div.info-ic', null, iconEl(g)),
        h('p', null, g.subtitle),
        s && s.text ? h('p.info-status', null, s.text) : null);
      showModal({
        title: g.title, content,
        buttons: [
          { label: 'Spielen', value: 'play', primary: true },
          ...(g.daily ? [{ label: 'Tagesrätsel', value: 'daily' }] : []),
          { label: 'Schliessen', value: null, ghost: true },
        ],
      }).then((v) => {
        if (!v) return;
        rememberPlay(g);
        location.href = `${g.id}/${v === 'daily' ? '#daily' : ''}`;
      });
    }

    // Tagesrätsel
    const dailies = games.filter((g) => g.daily);
    if (dailies.length) {
      document.getElementById('daily-wrap').classList.remove('hidden');
      const box = document.getElementById('daily');
      const sorted = [...dailies].sort((a, b) => isDailyDone(a.id) - isDailyDone(b.id));
      for (const g of sorted) {
        const done = isDailyDone(g.id);
        const streak = dailyStreak(g.id);
        const a = h('a', { href: `${g.id}/#daily`, class: done ? 'done' : '' },
          iconEl(g),
          h('span', null,
            h('b', null, g.title),
            h('small', null, done ? `✓ Gelöst${streak > 1 ? ` · ${streak} Tage` : ''}` : (streak > 0 ? `Serie: ${streak} Tage` : 'Heute neu'))));
        a.addEventListener('click', () => { sfx.play('tap'); rememberPlay(g); });
        box.append(a);
      }
    }

    // Kategorien + Katalog
    const chips = document.getElementById('chips');
    const grid = document.getElementById('grid');
    let current = store.get('hub.category', 'alle');
    if (current !== 'alle' && !categories.some((c) => c.id === current)) current = 'alle';

    function renderGrid() {
      grid.replaceChildren(...games.filter((g) => current === 'alle' || g.category === current).map((g) => tile(g)));
      for (const c of chips.children) c.classList.toggle('active', c.dataset.id === current);
    }
    for (const c of [{ id: 'alle', title: 'Alle' }, ...categories.filter((c) => games.some((g) => g.category === c.id))]) {
      const b = h('button.chip', { type: 'button', role: 'tab', 'data-id': c.id }, c.title);
      b.addEventListener('click', () => {
        current = c.id; store.set('hub.category', current); sfx.play('click'); renderGrid();
      });
      chips.append(b);
    }
    renderGrid();

    // Scrollposition merken (zurück aus einem Spiel)
    const scroller = document.getElementById('scroll');
    scroller.scrollTop = store.get('hub.scroll', 0);
    scroller.addEventListener('scroll', () => store.set('hub.scroll', scroller.scrollTop), { passive: true });

    // Installations-Tipp nur in Safari ausserhalb des Home-Bildschirm-Modus
    const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios && !standalone && !store.get('hub.tipHidden', false)) {
      const tip = document.getElementById('install-tip');
      tip.classList.remove('hidden');
      tip.addEventListener('click', () => { tip.classList.add('hidden'); store.set('hub.tipHidden', true); });
    }

    // Kehrt man per Zurück-Geste zurück (bfcache), Status neu laden
    window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
  </script>
</body>
</html>
