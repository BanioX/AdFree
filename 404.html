<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#fbf6ef">
  <title>Bald da – Spielpause</title>
  <style>
    html, body { height: 100%; margin: 0; background: #fbf6ef; color: #2b2420;
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px; box-sizing: border-box; }
    .art { font-size: 72px; line-height: 1; margin-bottom: 18px; animation: float 4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-8px) rotate(4deg); } }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 900; letter-spacing: -.02em; }
    p { margin: 0 0 26px; color: #7a6e64; font-size: 17px; font-weight: 600; max-width: 320px; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 0 28px;
      border-radius: 999px; background: #ff7a59; color: #fff; font-weight: 800; font-size: 18px; text-decoration: none;
      box-shadow: 0 10px 24px rgba(255, 122, 89, .35); }
  </style>
</head>
<body>
  <main>
    <div class="art" aria-hidden="true">🧩</div>
    <h1>Hier wird noch gebastelt</h1>
    <p>Dieses Spiel ist bald fertig. Schau morgen wieder vorbei!</p>
    <a href="../" id="home">Zur Spielauswahl</a>
  </main>
  <script>
    // Zur Startseite der App (funktioniert auch unter Unterordnern wie /AdFree/)
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var a = document.getElementById('home');
      if (location.hostname.endsWith('github.io') && parts.length) a.href = '/' + parts[0] + '/';
      else a.href = '/';
    })();
  </script>
</body>
</html>
