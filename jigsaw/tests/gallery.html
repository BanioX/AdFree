<!doctype html>
<html><head><meta charset="utf-8"><title>Galerie</title>
<style>body{margin:0;background:#333;font:12px sans-serif;color:#fff}#g{display:flex;flex-wrap:wrap;gap:6px;padding:6px}figure{margin:0}canvas{display:block;width:var(--cw,240px)}</style>
</head><body><div id="g" style="--cw:${0}"></div>
<script type="module">
import { painterById } from '../art/index.js';
import { palettes } from '../data/palettes.js';
import { makeRng } from '../../shared/rng.js';
const q = new URLSearchParams(location.search);
const painter = q.get('p') || 'berge';
const pals = (q.get('pal') || Object.keys(palettes).join(',')).split(',');
const seeds = (q.get('seeds') || '1').split(',').map(Number);
const opts = JSON.parse(q.get('o') || '{}');
const W = +(q.get("w") || 480), H = W * 4 / 3;
const t0 = performance.now();
for (const pal of pals) for (const seed of seeds) {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.scale(W / 1000, W / 1000);
  const tt = performance.now();
  painterById(painter).paint(ctx, { w: 1000, h: 1000 * H / W, rng: makeRng(seed * 7 + 1), pal: palettes[pal], opts, makeCanvas: (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; } });
  const f = document.createElement('figure');
  f.append(cv, Object.assign(document.createElement('figcaption'), { textContent: `${pal} #${seed} ${(performance.now() - tt).toFixed(0)}ms` }));
  document.getElementById('g').append(f);
}
document.title = 'done ' + (performance.now() - t0).toFixed(0);
</script></body></html>
